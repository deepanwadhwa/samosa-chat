name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Confirm the runner architecture
        run: |
          uname -a

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake libomp
          python3 -m pip install --break-system-packages numpy || true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev gcc clang
          python3 -m pip install numpy || true

      - name: Install pinned PDFium SDK
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s):$(uname -m)" in
            Darwin:arm64)
              url=https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7961/pdfium-mac-arm64.tgz
              sha=1193a771e0bd934530afa3df73a0d44551d8f4078442e290054e6dd38ded960f
              ;;
            Linux:x86_64)
              url=https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7961/pdfium-linux-x64.tgz
              sha=019665c8877d46fe65f625f80fd714ab07aac68554b0636acf2a2adf9288adb2
              ;;
            *)
              echo "No pinned PDFium SDK for $(uname -s):$(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fL --retry 3 -o "$RUNNER_TEMP/pdfium.tgz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/pdfium.tgz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/pdfium"
          tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium"
          echo "PDFIUM_DIR=$RUNNER_TEMP/pdfium" >> "$GITHUB_ENV"
          echo "SAMOSA_REQUIRE_PDF_ATTACHMENTS=1" >> "$GITHUB_ENV"

      - name: Build (portable)
        run: make

      - name: Build (multithreaded)
        run: make omp

      # Maple is a shipped Apple-Silicon runtime, so the arm64 release tests
      # must package a real clean-runner build rather than relying on a local
      # developer artifact or weakening package_hf.py's fail-closed contract.
      - name: Build Maple runtime (Apple Silicon)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          make mlx
          make samosa-maple

      # The suite is self-contained: it stubs the engine and the network, and
      # uses tiny fixtures rather than the 24 GB model, so it runs on a clean
      # runner with no download.
      - name: Test
        run: make test

      - name: Test automatic file routing
        run: |
          make test-document-harness test-audio-attachments test-molmo2-gateway test-molmo2-processor
          node tests/test_composer_ui.mjs
          node tests/test_composer_perf.mjs
          node tests/test_session_token_ui.mjs

      - name: Test inside Debian bookworm container
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/source:ro" \
            debian:bookworm-slim \
            sh -ec '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                make gcc libomp-dev curl python3 file nodejs sqlite3 ca-certificates

              useradd -m ci
              mkdir -p /work

              cd /source
              tar \
                --exclude=.git \
                --exclude=.ci-pdfium \
                --exclude=build \
                --exclude="build-*" \
                -cf - . | tar -xf - -C /work

              chown -R ci:ci /work

              su -s /bin/sh ci -c "
                cd /work
                rm -rf build-debian
                BUILD_DIR=build-debian make debian-portability-test
              "
            '
